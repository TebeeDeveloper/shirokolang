<body>


    <!-- =========================

    <canvas id="matrix"></canvas>


    <!-- =========================
         MAIN INTERFACE
    ========================= -->

    <div class="container">


        <h1>
            SHIROKO WEB COMPILER
        </h1>


        <div class="box">


            <!-- FILE -->

            <label for="sourceFile">
                Chọn file:
            </label>

            <input
                type="file"
                id="sourceFile"
            >


            <!-- FILE NAME -->

            <label for="fileName">
                Tên file biên dịch:
            </label>

            <input
                type="text"
                id="fileName"
                placeholder="Ví dụ: main.sk"
            >


            <!-- TARGET -->

            <!-- TARGET -->

<label for="target">
    Target:
</label>

<select id="target">

    <option value="cpp">
        C++
    </option>

</select>


<!-- COMPILER -->

<label for="compiler">
    Compiler:
</label>

<select id="compiler">

    <option value="g++">
        g++
    </option>

    <option value="clang++">

    </option>

    </option>

</select>

            </select>


            <!-- COMPILE -->

            <button onclick="compile()">
                COMPILE
            </button>


            <!-- OUTPUT -->

            <div id="output">
                Đang khởi động compiler...
            </div>


        </div>

    </div>



    <script>


        /* ==================================================
           MATRIX DIGITAL RAIN
        ================================================== */


        const canvas =
            document.getElementById("matrix");

        const ctx =
            canvas.getContext("2d");


        let fontSize = 16;

        let columns;

        let drops;


        function resizeMatrix() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;


            columns =
                Math.floor(
                    canvas.width / fontSize
                );


            drops = [];


            for (
                let i = 0;
                i < columns;
                i++
            ) {

                drops[i] =
                    Math.floor(
                        Math.random() * -100
                    );

            }

        }


        resizeMatrix();


        const characters =

            "アァカサタナハマヤャラワ" +

            "ガザダバパ" +

            "アァカサタナハマヤャラワ" +

            "アァカサタナハマヤャラワ" +

            "アァカサタナハマヤャラワ";


        function drawMatrix() {


            /*
             * Lớp đen trong suốt
             * tạo hiệu ứng đuôi
             */

            ctx.fillStyle =
                "rgba(0, 0, 0, 0.06)";


            ctx.fillRect(

                0,
                0,

                canvas.width,
                canvas.height
            );


            ctx.font =
                fontSize + "px monospace";


            for (
                let i = 0;
                i < drops.length;
                i++
            ) {


                const character =

                    characters[
                        Math.floor(
                            Math.random() *
                            characters.length
                        )
                    ];


                /*
                 * Một vài ký tự
                 * sáng trắng
                 */

                if (
                    Math.random() > 0.98
                ) {

                    ctx.fillStyle =
                        "#ffffff";

                } else {

                    ctx.fillStyle =
                        "#00ff41";
                }


                ctx.fillText(

                    character,

                    i * fontSize,

                    drops[i] * fontSize
                );


                /*
                 * Khi xuống cuối màn hình
                 * thì quay lại phía trên
                 */

                if (

                    drops[i] * fontSize >
                    canvas.height &&

                    Math.random() > 0.975

                ) {

                    drops[i] = 0;
                }


                drops[i]++;

            }

        }


        setInterval(
            drawMatrix,
            35
        );


        window.addEventListener(
            "resize",
            resizeMatrix
        );



        /* ==================================================
           GO WASM
        ================================================== */


        let wasmReady = false;


        const go = new Go();


        WebAssembly.instantiateStreaming(

            fetch("shiroko.wasm"),

            go.importObject

        )

        .then((result) => {


            /*
             * Chạy Go WASM
             */

            go.run(
                result.instance
            );


            wasmReady = true;


            document.getElementById(
                "output"
            ).textContent =

                "Shiroko Compiler đã sẵn sàng.";


        })


        .catch((error) => {


            document.getElementById(
                "output"
            ).textContent =

                "Không thể tải WASM:\n" +
                error;


            console.error(error);

        });



        /* ==================================================
           COMPILE
        ================================================== */


        async function compile() {


            if (!wasmReady) {

                alert(
                    "Compiler chưa sẵn sàng!"
                );

                return;
            }


            const fileInput =

                document.getElementById(
                    "sourceFile"
                );


            const fileName =

                document.getElementById(
                    "fileName"
                ).value;


            /*
             * Target hiện tại
             * CHỈ LÀ GIAO DIỆN.
             *
             * Chưa truyền vào compiler.
             */

            const target =
    document.getElementById(
        "target"
    ).value;

const compiler =
    document.getElementById(
        "compiler"
    ).value;


            if (
                fileInput.files.length === 0
            ) {

                alert(
                    "Vui lòng chọn file!"
                );

                return;
            }


            if (!fileName) {

                alert(
                    "Vui lòng nhập tên file!"
                );

                return;
            }


            const file =
                fileInput.files[0];


            const sourceCode =
                await file.text();


            document.getElementById(
                "output"
            ).textContent =

                "Target: " +
                target +

                "\nĐang biên dịch...";


            try {


                /*
                 * CompileJS hiện tại
                 * vẫn chỉ nhận:
                 *
                 * sourceCode
                 * fileName
                 */

                const result =

                    window.CompileJS(

                        sourceCode,

                        fileName

                    );


                document.getElementById(
                    "output"
                ).textContent =

                    result;


            }


            catch (error) {


                document.getElementById(
                    "output"
                ).textContent =

                    "Compile error:\n" +
                    error;


                console.error(error);

            }

        }

    </script>


</body>

</html>
